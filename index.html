<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Meat - デジタルミート</title>
  <meta name="description" content="Digital Meat（デジタルミート）公式ウェブサイト。我々は音楽を行う日本のバンドです。">
  <meta property="og:title" content="Digital Meat - デジタルミート">
  <meta property="og:description" content="我々は音楽を行う日本のバンドです">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <div class="logo-area">
      <h1 class="logo">
        <span class="logo-bracket">[</span>Digital<span class="logo-dot">.</span>Meat<span class="logo-bracket">]</span>
      </h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <nav id="nav">
      <a href="#lives">LIVES</a>
      <a href="#news">NEWS</a>
      <a href="#members">MEMBERS</a>
      <a href="#links">LINKS</a>
    </nav>
  </header>

  <main>
    <section id="lives" class="section">
      <h2 class="section-title">&gt; LIVES<span class="cursor">_</span></h2>
      <div id="lives-container" class="card-container">
        <p class="loading">loading...</p>
      </div>
    </section>

    <section id="news" class="section">
      <h2 class="section-title">&gt; NEWS<span class="cursor">_</span></h2>
      <div id="news-container" class="card-container">
        <p class="loading">loading...</p>
      </div>
    </section>

    <section id="members" class="section">
      <h2 class="section-title">&gt; MEMBERS<span class="cursor">_</span></h2>
      <div id="members-container" class="card-container"></div>
      <p id="formed" class="formed"></p>
    </section>

    <section id="links" class="section">
      <h2 class="section-title">&gt; LINKS<span class="cursor">_</span></h2>
      <div id="links-container" class="card-container"></div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Digital Meat</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
